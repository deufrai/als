default:
  interruptible: true

stages:
  - deploy

variables:
  GIT_STRATEGY: clone

deploy_to_staging:
  stage: deploy
  tags: [infra]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "feature/0.7.1-doc" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/0.7"'
    - if: '$CI_COMMIT_BRANCH == "release/0.7"'
    - when: never
  script:
    - ./ci/deploy/deploy_staging_website.sh
  environment:
    name: staging
    url: https://preprod.als-app.org/
