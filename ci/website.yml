default:
  interruptible: true

variables:
  GIT_STRATEGY: clone

Deploy website to preprod:
  stage: deploy
  tags: [infra]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release/0.7"'
    - if: '$CI_COMMIT_BRANCH == "release/0.7"'
    - when: never
  script:
    - ./ci/deploy/deploy_website_to_preprod.sh
  environment:
    name: preprod
    url: https://preprod.als-app.org/

Deploy website to prod:
  stage: deploy
  tags: [infra]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-deploy-test-[0-9A-Za-z._-]+$/'
      when: manual
    - when: never
  script:
    - ./ci/deploy/deploy_website_to_prod.sh
  environment:
    name: production
    url: https://als-app.org/
